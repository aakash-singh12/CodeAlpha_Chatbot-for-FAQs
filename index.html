<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aetheris Voyage — Space FAQ AI Assistant</title>
  <meta name="description" content="Intelligent interactive AI Chatbot for Aetheris Voyage premium suborbital space flights and lunar cruise services. Powered by Anthropic Claude API.">
  
  <!-- Google Fonts: Space/Sci-Fi headers (Orbitron) and clean body text (Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@400;600;800;900&display=swap" rel="stylesheet">
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="styles.css">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            cosmic: {
              50: '#f3f4fd',
              100: '#e7e8fc',
              200: '#d2d5fa',
              300: '#b0b5f5',
              400: '#868dee',
              500: '#5c63e4',
              600: '#464ad4',
              700: '#383ab9',
              800: '#1b1b4b',
              900: '#0b0c1e',
              950: '#04040d',
            },
            stellar: {
              cyan: '#06b6d4',
              violet: '#8b5cf6',
              purple: '#7c3aed',
              fuchsia: '#d946ef',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Orbitron', 'sans-serif'],
          },
          boxShadow: {
            'glass': '0 8px 32px 0 rgba(0, 0, 0, 0.5)',
            'glass-inset': 'inset 0 1px 1px 0 rgba(255, 255, 255, 0.1)',
            'glow-violet': '0 0 20px rgba(139, 92, 246, 0.35)',
            'glow-cyan': '0 0 20px rgba(6, 182, 212, 0.35)',
          },
          backdropBlur: {
            'xs': '2px',
          }
        }
      }
    }
  </script>
</head>
<body class="h-full bg-cosmic-950 text-slate-100 overflow-hidden font-sans relative antialiased">

  <!-- Particle Stars Canvas Background -->
  <canvas id="starsCanvas" class="absolute inset-0 w-full h-full pointer-events-none z-0"></canvas>

  <!-- Glowing Nebulae Background Blobs -->
  <div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] rounded-full bg-stellar-purple/10 blur-[120px] pointer-events-none z-0"></div>
  <div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] rounded-full bg-stellar-cyan/10 blur-[120px] pointer-events-none z-0"></div>

  <!-- React Mount Point -->
  <div id="root" class="relative z-10 w-full h-full flex flex-col"></div>

  <!-- Load UMD React, ReactDOM, and Babel for In-Browser JSX Compilation -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Load application scripts -->
  <script type="text/babel" src="app.js"></script>

  <!-- Simple script to initialize the canvas starfield particles -->
  <script>
    const canvas = document.getElementById('starsCanvas');
    const ctx = canvas.getContext('2d');
    
    let stars = [];
    const numStars = 100;
    
    function initCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      stars = [];
      for (let i = 0; i < numStars; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 1.5,
          color: `rgba(${Math.floor(200 + Math.random() * 55)}, ${Math.floor(200 + Math.random() * 55)}, 255, ${0.2 + Math.random() * 0.8})`,
          speed: 0.05 + Math.random() * 0.15
        });
      }
    }
    
    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      stars.forEach(star => {
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fillStyle = star.color;
        ctx.fill();
        
        // Drift downwards slowly
        star.y += star.speed;
        if (star.y > canvas.height) {
          star.y = 0;
          star.x = Math.random() * canvas.width;
        }
      });
      requestAnimationFrame(animate);
    }
    
    window.addEventListener('resize', initCanvas);
    initCanvas();
    animate();
  </script>
</body>
</html>
